<h2>编程语言：定义计算机程序的形式语言，用于控制计算机的行为。</h2>
<h3>1.编程语言特点</h3>
<ul>
  <li>数据和数据结构</li>
  <li>指令及流程控制</li>
  <li>引用机制和重用机制</li>
  <li>设计哲学</li>
</ul>
<h3>2.编程语言历程：机器语言（二进制码，效率好，可读性差，所有语言都是变成机器语言，然后被计算机执行）汇编语言（用符号代替01，可以直接访问控制计算机的各种硬件设备；占用内存少，可移植性差，难记，偏硬件）
  高级语言（自然语言，越远离硬件语言，简单，可移植，不用熟悉硬件知识，不能直接被计算机识别，会有性能损耗）</h3>
