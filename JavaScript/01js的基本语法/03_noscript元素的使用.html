<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <!-- 1.noscript:当设置浏览器不支持JavaScript时显示的内容，如果支持则不显示 -->
  <noscript>
    <h1>您的浏览器不支持JavaScript，请更换浏览器或者开启JavaScript支持</h1>
  </noscript>
  <!-- 浏览器可以设置不支持javascript -->
  <script>
    alert("如果浏览器不支持JavaScript,会显示noscript标签中的内容");
  </script>


</body>

</html>
