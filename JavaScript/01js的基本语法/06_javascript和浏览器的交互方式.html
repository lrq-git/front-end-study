<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>






  <script>
    // 前三个事让浏览器输出
    // 1.交互方式一：弹出对话框——alert函数(接受一个参数，参数可以是任意类型)
    // alert("Hello world！");


    // 2.交互方式二：console.log函数(将内容输出到控制台打印信息)
    // 使用最多的交互方式
    // consloe是一个对象，log是这个对象的方法(函数)
    // console.log("Hello console!");

    // 1.如果编写的javascript报错了，在console里面显示错误信息2.可以在控制台直接写js代码进行调试，如果在里面要多行则shift+enter换行

    // 3.交互方式三：document.write函数(将内容直接写入到HTML页面中)
    // document.write("Hello document!");


    // 4.交互方式四：prompt函数(弹出一个对话框，提示用户输入内容，并返回用户输入的内容)
    // 获取用户输入的内容，用的少
    var result = prompt("请输入您的名字：");
    //  这个函数有返回值，这个函数里面的参数是提示信息
    alert("您刚才输入的内容是" + result)
  </script>
</body>

</html>
