<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>


  <script>
    // 变量命名规范
    // 1.多个单词组成的变量名，采用驼峰命名法（camelCase）
    // 小驼峰命名法：第一个单词首字母小写，后面每个单词首字母大写(用这个)
    // 大驼峰命名法：每个单词首字母都大写
    var firstName = "John"; // 小驼峰命名法
    // 2.等号两边加空格，增强可读性
    // 3.变量名要具有描述性，能体现变量所代表的数据含义
  </script>
</body>

</html>
