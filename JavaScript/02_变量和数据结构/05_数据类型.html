<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 一串文本组成，称之为一个字符串，字符串用引号括起来，可以使用单引号、双引号或者反引号
    var str1 = '这是一个字符串';
    str1 = 123;
    // 注1.变量的值的类型决定了这个变量是什么类型的变量
    // 注2.在js中，一个变量在前一刻是字符串，后一刻存储数字是可行的。允许这种操作的语言叫做动态类型语言，js就是动态类型语言
    // 注3.有八种数据类型：字符串、数字（Number，不区分整型浮点型等）、布尔值、null、undefined、Symbol、BigInt和object（7种基本数据类型和一种引用数据类型）
  </script>
</body>

</html>
