<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>

    // 注1.typeof不是函数，而是一个操作符，不能像函数一样调用，不能加括号
    // typeof操作符：可以用来检测一个值的数据类型，返回一个字符串，表示这个值的数据类型
    console.log(typeof "hello"); // 输出: string
    console.log(typeof 123); // 输出: number
    console.log(typeof true); // 输出: boolean
    console.log(typeof undefined); // 输出: undefined，如果变量未声明或者未赋值，typeof的结果都是undefined
    console.log(typeof null); // 输出: object（这是js的一个历史遗留问题，null被错误地识别为对象类型）
    console.log(typeof Symbol("sym")); // 输出: symbol
    console.log(typeof 9007199254740991n); // 输出: bigint
    console.log(typeof {}); // 输出: object
    console.log(typeof []); // 输出: object（数组也是一种对象）
    console.log(typeof function () { }); // 输出: function（函数也是一种对象，但typeof会特殊识别为function）
    // 2.（）的作用
    // 1）表示调用函数alert()
    // 2）将某一个表达式包裹起来，提升表达式的优先级，typeof如果后面跟的是一个表达式，必须用括号将这个表达式包裹起来，否则会报错  
  </script>
</body>

</html>
