<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>


    // 1.Number类型：表示数字，包括整数和浮点数
    var num1 = 123; // 整数
    var num2 = 3.14; // 浮点数
    // 2.特殊的数值
    var num3 = NaN; // Not a Number，表示不是一个合法的数字
    var num4 = Infinity; // 正无穷大  
    var num4 = 1 / 0; // 正无穷大  
    // 3.进制
    var num5 = 0b1010; // 二进制，等于十进制的10
    var num6 = 0o12; // 八进制，等于十进制的10
    var num7 = 0xA; // 十六进制，等于十进制的10
    // 4.数字可以表示的范围
    var maxNum = Number.MAX_VALUE; // 最大的正数
    var minNum = Number.MIN_VALUE; // 最小的正数  
    // 5.isNaN()函数：判断一个值是否是NaN
    console.log(isNaN(num3)); // true
  </script>
</body>

</html>
