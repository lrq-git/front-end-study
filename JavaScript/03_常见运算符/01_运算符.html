<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //算术运算符、赋值运算符、比较（关系）运算符、逻辑运算符等
    //运算元：参与运算的值或者变量
    //运算符：对运算元进行操作的符号或者关键字，根据参与运算元的数量可以分为一元运算符、二元运算符和三元运算符
    //1.算术运算符：用于进行数学计算的运算符，包括加法（+）也可以拼接字符串、减法（-）、乘法（*）、除法（/）、取余（%）和指数（**）(ES7)等
    var num1 = 5
    var num2 = 8
    var result = num1 + num2
    console.log(result)

    //2的3次方
    console.log(2 ** 3)
    console.log(Math.pow(2, 3))
  </script>
</body>

</html>
