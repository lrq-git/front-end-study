<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //算术运算符、赋值运算符、比较（关系）运算符、逻辑运算符等
    //运算元：参与运算的值或者变量
    //运算符：对运算元进行操作的符号或者关键字，根据参与运算元的数量可以分为一元运算符、二元运算符和三元运算符
    //2.赋值运算符
    //2.1: =
    var num = 123
    //2.2:链式赋值（chaining assignments)
    var num1 = num2 = num3 = 2 + 2
    console.log(num1, num2, num3)
    //不推荐写链式赋值这种写法
  </script>
</body>

</html>
