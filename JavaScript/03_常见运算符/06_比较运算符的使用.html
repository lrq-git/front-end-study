<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //运算符的优先级
    //1.括号
    //2.自增自减（++ --）
    //3.算术运算符（** > * / % > + -）
    //4.比较（关系）运算符（> < >= <= == != === !==）
    //5.逻辑运算符（&& > ||）
    var num1 = 5
    var num2 = 10
    //1.比较运算符，结果是一个布尔值（true或者false）
    var isresult = num1 > num2
    console.log(isresult)
    //判断
    console.log(num1 == num2)
    console.log(num1 != num2)
    console.log(num1 === num2)
    console.log(num1 !== num2)

  </script>
</body>

</html>
