<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //程序的执行顺序三种：
    // 1. 顺序执行（代码从上到下依次执行）
    var num1 = 10
    var num2 = 20
    var result = num1 + num2
    console.log(result)
    // 2. 条件执行（根据条件的真假来决定是否执行特定代码）
    var isLogin = true
    if (isLogin) {
      console.log('欢迎回来！')
    } else {
      console.log('请先登录！')
    }
    // 3. 循环执行（特定代码重复执行）
    var i = 0
    while (i < 5) {
      console.log("执行循环语句")
      i++
    } 
  </script>
</body>

</html>
