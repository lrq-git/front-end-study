<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //{}，可以用来表示一个代码块，或者一个对象字面量
    //在if语句、for循环、while循环等语句中，{}表示一个代码块，包含了多条语句
    if (true) {
      console.log("条件成立")
      console.log("条件成立")
    }
    //在对象字面量中，{}表示一个对象，包含了多个属性和方法
    var person = {
      name: "张三",
      age: 20,
      sayHello: function () {
        console.log("你好！")
        //也可以把代码块封装为函数
      }
    }
  </script>
</body>

</html>
