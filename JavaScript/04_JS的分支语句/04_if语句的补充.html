<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //补充1.如果{}里面只有一条语句，{} 可以省略
    //案例二：苹果单价5元/斤，如果购买数量超过5斤，那么立减8元
    //1定义一些变量
    var price = 5;
    var weight = 6;
    var totalPrice = price * weight;
    if (weight > 5)
      totalPrice -= 8;

    console.log("总价是：" + totalPrice);
    //补充2.if(条件判断)，括号里面的表达式的计算结果会转换成布尔值，如果条件成立，执行if语句块中的代码，否则不执行
    //数字0、NaN、null、undefined、false，空字符串会被转换成false，其他值都会被转换成true
    var num = 0;
    if (num) {
      console.log("条件成立")
    }
  </script>
</body>

</html>
