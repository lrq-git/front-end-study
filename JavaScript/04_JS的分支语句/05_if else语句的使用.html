<body>
  <script>
    //两个数字，进行比较，获取较大的数字
    var num1 = 12 * 6
    var num2 = 100 - 50
    var result = 0
    if (num1 > num2) {
      result = num1
    } else {
      result = num2
    }
    console.log("较大的数字是：" + result);
  </script>
</body>
