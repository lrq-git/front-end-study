<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    var num1 = 12 * 6 + 7 * 8
    var num2 = 100 - 50 + 20 * 3
    var result = num1 > num2 ? num1 : num2
    console.log("较大的数字是：" + result);

    //三元运算符可以用于给变量赋值一个默认值
    var info = {
      name: "张三",
      age: 20
    }
    var obj = info ? info : {}
    console.log(obj);
    //案例：让用户输入一个年龄，判断是否为成年人
    var age = prompt("请输入您的年龄：");
    age = Number(age);
    /*  var isAdult = age >= 18 ? true : false;
     console.log("您是否为成年人：" + isAdult); */
    alert(age >= 18 ? "您是成年人" : "您不是成年人");
  </script>
</body>

</html>
