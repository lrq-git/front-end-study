<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //逻辑非：对一个操作数进行取反，如果操作数为真，结果为假；如果操作数为假，结果为真
    console.log(!true); //false 
    console.log(!false); //true

    //将数据类型转成布尔类型
    var obj = null;
    console.log(Boolean(obj));
    console.log(!!obj); 
  </script>
</body>

</html>
