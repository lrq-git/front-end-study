<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 循环的嵌套理解
    for (let i = 0; i < 3; i++) {
      console.log('i开始执行：' + i);
      for (let j = 0; j < 2; j++) {
        console.log('执行j循环：' + j);
      }
      console.log('i结束执行：' + i);
    }
  </script>
</body>

</html>
