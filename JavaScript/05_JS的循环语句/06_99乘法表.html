<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    table {
      border-collapse: collapse;
    }

    td {
      padding: 8px 16px;
      border: 1px solid red;
    }
  </style>
</head>

<body>
  <script>
    //99乘法表
    document.write("<table>")
    for (let i = 0; i < 9; i++) {
      document.write("<tr>")
      for (let j = 0; j < i + 1; j++) {
        document.write(`<td>${j + 1}*${i + 1}=${(i + 1) * (j + 1)}</td>`);
      }
      document.write('</tr>');
    }
    document.write("</table>")

  </script>
</body>

</html>
