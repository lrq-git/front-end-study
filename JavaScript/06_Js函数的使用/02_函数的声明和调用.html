<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    // 函数需要：
    // 1.声明function foo(){}
    // 2.调用(定义的函数不会执行，必须调用才会执行)foo()

    // 函数的声明和调用
    function sayHello() {
      console.log('Hello');
    }

    // 调用函数
    sayHello()

  </script>
</body>

</html>
