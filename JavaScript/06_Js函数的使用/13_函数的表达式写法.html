<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //函数都是一个值，这个值是对象
    //1.函数的表达式写法：将一个匿名函数赋值给一个变量，这个变量就成为了这个函数的名字，可以通过这个变量来调用这个函数
    foo(); // 报错：foo is not defined
    var foo = function () {
      console.log("Hello, World!"); // 输出"Hello, World!"
    }
    foo(); // 调用foo函数，输出"Hello, World!"
    //2.函数的声明式写法：直接定义一个函数，这个函数就有了一个名字，可以通过这个名字来调用这个函数
    bar(); // 调用bar函数，输出"Hello, JavaScript!"
    function bar() {
      console.log("Hello, JavaScript!"); // 输出"Hello, JavaScript!"
    }
    bar(); // 调用bar函数，输出"Hello, JavaScript!"

    //这与js函数代码提升有关，函数声明式写法会被提升到代码的最前面，所以在函数声明之前就可以调用这个函数，而函数表达式写法不会被提升，所以在函数表达式之前调用这个函数会报错。
  </script>
</body>

</html>
