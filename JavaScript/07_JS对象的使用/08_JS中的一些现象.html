<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    var num1 = 10;
    var num2 = 10;
    console.log(num1 === num2); //true,基本数据类型比较的是值

    //现象一：对象类型的比较是比较地址值
    var obj1 = {}
    var obj2 = {}
    console.log(obj1 === obj2); //false,对象类型比较的是地址值

    //现象二：引用的赋值
    var info1 = {
      name: 'coderwhy',
      age: 18,
      friend: {
        name: 'kobe',
        age: 40
      }
    }

    var friend = info1.friend;
    friend.name = 'lilei';
    console.log(info1.friend.name); //lilei,因为friend和info1.friend指向同一个地址值，所以修改friend.name也会修改info1.friend.name的值

    //现象三：值传递
    function foo(a) {
      a = 200
    }
    var num = 100;
    foo(num);
    console.log(num); //100,因为基本数据类型是值传递，函数内部修改a的值不会影响外部num的值
    //现象四：引用传递,但是函数中创建了一个新对象，没有对传入对象进行修改
    function foo(a) {
      a = {
        name: 'coderwhy'
      }
    }
    var obj = {
      name: 'why'
    };
    foo(obj);
    console.log(obj); //why,因为对象类型是引用传递，函数内部

    //现象五：引用传递,函数中修改了传入对象的属性值
    function foo(a) {
      a.name = 'coderwhy'
    }
    var obj = {
      name: 'why'
    };
    foo(obj);
    console.log(obj)//{name: 'coderwhy'},因为对象类型是引用传递，函数内部修改了传入对象的属性值，所以外部obj的属性值也被修改了

  </script>
</body>

</html>
