<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <script>
    //字符串在定义后不可修改
    /*  var message2 = "hello"
     message2[1] = "D"
     console.log(message2) */
    //开发中经常要对字符串进行各种操作，String是一个构造函数（类），包装类型
    var message = "hello world"

    //1.修改字符串，把之前的字符串内部修改
    //所有字符变成大写（其实不是改掉了字符串的值，而是生成了新的字符串）toUpperCase
    var message1 = message.toUpperCase()
    var message2 = message.toLowerCase()//变成小写
    console.log(message)
    console.log(message1)
    console.log(message2)

    //2.查找字符串:判断字符串中是否有另一个字符串(后面数组是一样的)
    var intro = "my name is why"
    var name = "why"
    // 2.1 indexOf(searchString, fromIndex)
    /* 这个函数返回的是index:情况一：搜索到，返回字符串所在索引的位置
              情况二：没有搜索到，返回-1 */
    var index = intro.indexOf(name)
    if (intro.indexOf(name) !== -1) {
      console.log("message中包含name")
    } else {
      console.log("message不包含")
    }

    //2.2ES6中新增一个方法，用来判断包含关系
    if (intro.includes(name)) {
      console.log("包含")
    }
    // 2.3 startsWith:是否XXX开头
    if (intro.startsWith("my")) {
      console.log("是的")
    }
    // 2.4 endsWith:是否XXX结尾
    if (intro.endWith("why")) {
      console.log("是的")
    }
    // 2.5替代字符串replace
    var newIntro = intro.replace("why", "kobe")
    console.log(intro)
    console.log(newIntro)

    //2.6获取子字符串
    console.log(intro.slice(3))
    console.log(intro.slice(3, 7))
    console.log(intro.slice(3, -1))
    //-1指的是最后一个元素，[3,7)[3, -1)

    // 2.7拼接字符串
    var str1 = "hello"
    var str2 = "world"
    var str3 = "kobe"
    var newString = str1 + str2 + str3
    //concat方法：链式调用
    var newString2 = str1.concat(str2).concat(str3)
    var newString3 = str1.concat(str2, str3, "abc")

    // 2.8删除首尾的空格
    console.log("     why    abc   ".trim())

    //2.9字符串切割
    var mess = "abc-ddd-dds-aaa"
    var items = mess.split("-")
    //会将mess拆分为里面的东西分为几个部分然后存为一个数组
    items.join("*")
    // 这个会把数组转为字符串















  </script>
</body>

</html>
