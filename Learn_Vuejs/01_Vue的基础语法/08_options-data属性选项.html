<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    <h2>{{message}}</h2>
    <button @click="changeMessage">改变message</button>
  </div>
  <script src="./lib/vue.js"></script>
  <script>
    const app = Vue.createApp({
      // 1.data需要传入函数(vue3),在vue2中也可以传入对象
      data: function () {
        return {
          message: "hello world"
        }
      },
      // 2.data返回的对象会被Vue相应式系统劫持，之后的对象的修改或者访问都会在劫持中被处理
      // methods: {}是用在事件绑定的时候用到的
      methods: {
        changeMessage: function () {
          this.message = "你好"
        }
      }

    })
    app.mount("#app")

    /* 问题：监听const info = {name:"why}中name 的变化，有什么方式
    1.Object.defineProperty（Vue 2 的底层原理）
    const info = { name: "why" };

// 因为我们要重写 get 和 set，所以需要一个变量来中转存储真正的值
let internalName = info.name;

// 开始监听 info 对象的 name 属性
Object.defineProperty(info, 'name', {
  // 当有人读取 info.name 时，触发 get
  get() {
    console.log(`[拦截提示] 有人正在读取 name 属性，当前值是: ${internalName}`);
    return internalName;
  },
  // 当有人修改 info.name 时，触发 set
  set(newValue) {
    console.log(`[拦截提示] 监听到 name 被修改了！从 ${internalName} 变成了 ${newValue}`);
    // 在这里你可以执行网页更新等其他操作
    internalName = newValue; // 把新值存起来
  }
});
2.Proxy 代理（Vue 3 的底层原理）
const info = { name: "why" };

// 创建一个代理对象
const proxyInfo = new Proxy(info, {
  // 拦截所有的读取操作 (target 是原对象，key 是属性名)
  get(target, key) {
    console.log(`[Proxy 拦截] 读取了属性: ${key}`);
    return target[key];
  },
  // 拦截所有的修改操作 (value 是新值)
  set(target, key, value) {
    console.log(`[Proxy 拦截] 监听到 ${key} 属性变成了: ${value}`);
    target[key] = value; 
    return true; // 必须 return true，告诉程序修改成功
  }
});

// 测试一下（注意：我们要操作 proxyInfo，而不是原来的 info）
console.log(proxyInfo.name);  // 触发 get
proxyInfo.name = "Gemini";    // 触发 set

// Proxy 的杀手锏：给对象新增一个原本没有的属性，依然能被监听到！
proxyInfo.age = 18;           // 触发 set，打印：监听到 age 属性变成了: 18 */
  </script>
</body>

</html>
