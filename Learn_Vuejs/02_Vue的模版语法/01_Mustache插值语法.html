<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    <!-- 1.基本的使用 -->
    <h2>{{message}}</h2>
    <h2>当前计数：{{counter}}</h2>

    <!-- 2.表达式 -->
    <h2>计数双倍：{{counter *2}}</h2>
    <h2>展示信息：{{info.split(" ")}}</h2>
    <!-- split会把字符串进行切割然后返回一个数组 -->

    <!-- 3.三元运算符 -->
    <h2>{{age >=18? "成年人": "未成年人"}}</h2>

    <!-- 4.可以调用methods的函数 -->
    <h2>{{formatDate(time)}}</h2>
    <!-- 注意这里不能定义语句,if语句也不可以 -->
    <!-- <h2>{{ const name = "why"; name }}</h2> -->
  </div>
  <script src="../lib/vue.js"></script>
  <script>
    // 1.创建app
    const app = Vue.createApp({
      data: function () {
        return {
          message: "hello world",
          counter: 100,
          info: "my name is lfd",
          age: 22,
          time: 123
        }
      },
      methods: {
        formatDate: function (date) {
          return "2022-10-10" + date
        }
      }
    })
    //2.挂载app
    app.mount("#app")
    /* 以后的App.vue里面有三大模块，其中一部分是<template></template> */

  </script>
</body>

</html>
