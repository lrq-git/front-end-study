<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">

    <h2 v-once>{{message}} </h2>
    <h2 v-text="message">aaa</h2>
    <!-- v-text：将动态数据直接替换掉元素的textcontent,用得少 -->
  </div>
  <script src="../lib/vue.js"></script>
  <script>
    // 1.创建app
    const app = Vue.createApp({
      data: function () {
        return {
          message: "hello world",
          counter: 100
        }
      },
      methods: {
        changeMessage: function () {
          this.message = "你好"
          this.counter += 100
        }
      }
    })
    //2.挂载app
    app.mount("#app")
  </script>
</body>

</html>
