<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">

    <h2 v-once>{{content}} </h2>
    <h2 v-html="content"></h2>
    <!-- 当服务器返回的内容是html标签需要，用v-html进行返回 -->

  </div>
  <script src="../lib/vue.js"></script>
  <script>
    // 1.创建app
    const app = Vue.createApp({
      data: function () {
        return {
          content: `<span style="color: red; font-size: 30px;">啊哈哈哈哈哈</span>`
        }
      },

    })
    //2.挂载app
    app.mount("#app")
  </script>
</body>

</html>
