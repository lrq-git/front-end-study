<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    <!-- v-bind动态绑定属性名 -->
    <h2 :[name]="aaa">hello world</h2>

  </div>
  <script src="../lib/vue.js"></script>
  <script>
    // 1.创建app
    const app = Vue.createApp({
      data: function () {
        return {
          name: "title"
        }
      },
    })
    //2.挂载app
    app.mount("#app")
  </script>
</body>

</html>
