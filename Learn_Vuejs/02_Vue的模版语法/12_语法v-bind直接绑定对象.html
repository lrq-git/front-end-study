<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    <!-- v-bind绑定对象 -->
    <h2 :name="name" :age="age" :height="height">hello world</h2>
    <!-- v-bind绑定对象(这个将常用)，给组件传参数 -->
    <h2 v-bind="infos"></h2>
  </div>
  <script src="../lib/vue.js"></script>
  <script>
    // 1.创建app
    const app = Vue.createApp({
      data: function () {
        return {
          name: "why",
          age: 18,
          height: 1.22,
          infos: { name: "why", age: 18, address: "广州市" }
        }
      },
    })
    //2.挂载app
    app.mount("#app")
  </script>
</body>

</html>
