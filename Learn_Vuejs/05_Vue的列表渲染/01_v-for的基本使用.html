<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .item {
      margin-top: 20px;
      background-color: orange;
    }
  </style>
</head>

<body>
  <div id="app">
    <h2>电影列表</h2>
    <!-- 1.遍历item -->
    <ul>
      <li v-for="movie in movies">{{movie}}</li>
      <!-- 插值语法里面的变量可以从data里面找，也可以从前面找（v-for) -->
    </ul>
    <!-- 2.电影列表同时有索引 -->
    <ul>
      <li v-for="(movie, index) in movies">{{index+1}} - {{movie}}</li>

      <!-- 插值语法里面的变量可以从data里面找，也可以从前面找（v-for) -->
    </ul>
    <!-- 3.遍历数组复杂数据 -->
    <h2>商品列表</h2>
    <div class="item" v-for="item in products">
      <h3>商品：{{item.name}}</h3>
      <span>价格：{{item.price}}</span>
      <p>秒杀：{{item.desc}}</p>

    </div>


  </div>
  <script src="../lib/vue.js"></script>
  <script>
    // 1.创建app
    const app = Vue.createApp({
      data() {
        return {
          // 服务器返回的都是一系列数据[{}, {},{}]
          movies: ["星际穿越", "少年派", "大话西游", "哆啦A梦"],

          // 更常见的是[{}, {},{}]
          products: [
            { id: 110, name: "Macbook", price: 9.9, desc: "9.9快秒杀" },
            { id: 111, name: "Iphone", price: 9.9, desc: "9.9快秒杀" },
            { id: 112, name: "小米电脑", price: 9.9, desc: "9.9快秒杀" }

          ]
        }
      },
    })
    //2.挂载app
    app.mount("#app")
  </script>
</body>

</html>
