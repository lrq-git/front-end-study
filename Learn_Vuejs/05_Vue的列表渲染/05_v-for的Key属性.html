<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
   <ul>
    <li v-for="item in letters">{{item}}</li>
   </ul>


  </div>
  <script src="../lib/vue.js"></script>
  <script>
    // 1.创建app
    const app = Vue.createApp({
      data() {
        return {
          letters: ["a", "b", "c", "d"]
        }
      },
    })
    //2.挂载app
    app.mount("#app")
  </script>
</body>

</html>
