<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    <h2>{{info.name}}</h2>
    <!-- 需求：当变量发生改变后，执行一套JS代码逻辑（监听data需要option api) -->
    <button @click="changeMessage">改变信息</button>
  </div>
  <script src="../lib/vue.js"></script>
  <script>
    // 1.创建app
    const app = Vue.createApp({
      data() {
        return {
          message: "hello world",
          info: { name: "why", age: 18 }
        }
      },
      methods: {
        changeMessage() {
          this.message = "你好"
          this.info = { name: "kobe" }
        }
      },
      watch: {
        // 1.一旦数据发生变换后就会执行回调函数，默认有两个参数： newValue/oldValue
        message(newValue, oldValue) {
          console.log("message数据发生了变化", newValue, oldValue)
          // 监听message数据变化后会执行的操作
        },
        info(newValue, oldValue) {
          // 2.如果是对象类型：拿到的是代理对象
          console.log("info数据发生了改变", newValue, oldValue)


          // 3.获得原生对象
          // console.log(...newValue)
          // proxey对象支持迭代（会把所有属性拿到然后放在新的对象中）
          // console.log(Vue.toRaw(newValue))
        }
      }
    })
    //2.挂载app
    app.mount("#app")
  </script>
</body>

</html>
