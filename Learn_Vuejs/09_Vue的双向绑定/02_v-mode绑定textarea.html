<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    <textarea name="" id="" cols="30" rows="10" v-model="content"></textarea>
    <!-- name是用来form表单提交时使用的 -->
    <p>{{content}}</p>
  </div>
  <script src="../lib/vue.js"></script>
  <script>
    // 1.创建app
    const app = Vue.createApp({
      data() {
        return {
          content: "hello world"
        }
      },
    })
    //2.挂载app
    app.mount("#app")
  </script>
</body>

</html>
