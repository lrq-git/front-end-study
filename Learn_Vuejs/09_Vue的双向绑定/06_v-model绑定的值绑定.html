<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    <!-- select的值绑定 -->
    <!-- 真实开发里面下拉框的选项也是从服务器里面传过来的 -->
    <!-- select的多选 -->
    <label for="city">水果：</label>
    <!--  multiple让下拉框为多选 -->
    <select multiple size="3" v-model="fruits">
      <option v-for="item in allFruits" :key="item.value" :value="item.value">
        {{item.text}}
      </option>
    </select>
    <h2>{{fruits}}</h2>

    <hr>
    <hr>

    <!-- 2.checkbox的值绑定 -->
    <div class="hobbies">
      <h2>请选择你的爱好：</h2>
      <template v-for="item in allHobbies" :key="item.value">
        <label :for="item.value">
          <input type="checkbox" :id="item.value" :v-model="hobbies" :value="item.value">{{item.text}}
        </label>
      </template>
    </div>
  </div>
  <script src="../lib/vue.js"></script>
  <script>
    // 1.创建app
    const app = Vue.createApp({
      data() {
        return {
          allFruits: [
            { value: "apple", text: "苹果" },
            { value: "orange", text: "橘子" },
            { value: "banana", text: "香蕉" }

          ],
          fruits: [],

          // 爱好
          allHobbies: [
            { value: "jump", text: "跳" },
            { value: "sing", text: "唱" },
            { value: "rap", text: "rap" }

          ],
          hobbies: []
        }
      },
    })
    //2.挂载app
    app.mount("#app")
  </script>
</body>

</html>
