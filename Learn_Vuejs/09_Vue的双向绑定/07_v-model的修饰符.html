<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    <!-- 1.lazy:v-model绑定的是input事件，如果加上修饰符-lazy绑定的是change事件 -->
    <input type="text" v-model.lazy="message">
    <h2>{{message}}</h2>
    <hr>

    <!-- 2.number：自动将内容转换成数字 -->
    <!-- 默认将用户输入的内容为字符串绑定在counter里面 -->
    <input type="text" v-model.number="counter">
    <h2>{{counter}}- {{typeof counter}}</h2>

    <!-- 如果input的类型就是number，输入其他的就输入不进去，可以不用.number -->
    <input type="number" v-model="counter2">
    <h2>{{counter2}}- {{typeof counter2}}</h2>

    <!-- 3.注意如果字符串类型“100”>90,做判断的时候JS会自动将字符串转换为数字型 -->

    <!-- 4.trim:去除收尾的空格 -->
    <!-- 浏览器会自动合并空格 （只留一个）-->
    <input type="text" v-model.trim="content">
    <!-- 这样如果只是单独加空格，不会赋新的值 -->
    <h2>{{content}}</h2>

    <!-- v-model.trim.lazy,多个修饰符可以同时使用 -->
  </div>
  <script src="../lib/vue.js"></script>
  <script>
    // 1.创建app
    const app = Vue.createApp({
      data() {
        return {
          message: "hello world",
          counter: 0,
          counter2: 1,
          content: ""
        }
      },
      watch: {
        content(newValue) {
          console.log("content", newValue)
        }
      }
    })
    //2.挂载app
    app.mount("#app")
  </script>
</body>

</html>
