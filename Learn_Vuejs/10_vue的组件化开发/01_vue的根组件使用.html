<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <div id="app">
    <h2>{{message}}</h2>

  </div>
  <script src="../lib/vue.js"></script>
  <script>
    // 1.创建app
    // 组件：APP组件（根组件）

    const App = {
      data() {
        return {
          message: "hello world"
        }
      },
    }
    const app = Vue.createApp(App)
    //2.挂载app
    app.mount("#app")
  </script>
</body>

</html>
