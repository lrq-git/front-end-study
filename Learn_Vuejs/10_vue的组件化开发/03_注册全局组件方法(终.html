<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .product {
      background-color: orange;
    }
  </style>
</head>

<body>
  <div id="app">

    <!-- 1.内容一 -->



    <!-- 使用product-item组件 -->
    <product-item></product-item>
    <product-item></product-item>

  </div>
  <!-- 组件product-item的模版 -->
  <template id="item">
    <div class="product">
      <h2> 我是商品 </h2>
      <div>商品图片</div>
      <div>商品价格：<span>¥9.9</span></div>
      <p>商品描述信息，9.9秒杀</p>
    </div>
  </template>
  <script src="../lib/vue.js"></script>
  <script>

    // 1.组件：APP组件（根组件）
    const App = {}


    // 2.创建app
    const app = Vue.createApp(App)

    // 3.注册一个全局组件
    // product-item全局组件
    app.component("product-item", {
      template: `#item`
    })


    //挂载app
    app.mount("#app")
  </script>
</body>

</html>
