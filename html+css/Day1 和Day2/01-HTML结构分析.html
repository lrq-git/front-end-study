<!-- 文档类型声明document type:
1.声明版本,这样写就是html5
2.让浏览器用Html5的标准去解析页面
3.必须放在最前面,不能忽略,否则出现兼容性问题 -->
<!DOCTYPE html>
<!--html元素: 根元素,增加lang属性(language)作用:
   1.帮助语音合成工具确定发音
   2.帮助翻译工具确定要使用的翻译规则 
   中文:lang="zh"这个范围广;lang="zh-CN"这个是简体中文-->
<html lang="en">
<!-- 规定文档相关(页面)的配置信息(元数据meta data :描述数据的数据)
   例如:网页标题,编码,css样式信息,网页最上面图标 -->

<head>
  <!--charset字符编码:让浏览器更精准的显示,不设置或者设置错误会导致乱码,utf不区分大小写
  meta是单标签元素  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 标题 -->
  <title>Document</title>
</head>
<!-- body元素的内容是在浏览器窗口看到的东西,也就是网页的具体内容和结构 -->

<body>
  <!-- 目前阶段学习的7个常见元素:
   1.p、h1-h6元素
   2.img 、 a 、iframe元素
   3.span 、div元素
    -->

</body>

</html>
<!-- HTML结构分析:
 1.文档声明
 2.html元素
     head元素
     body元素 -->
