<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <!-- 单标签,可替换元素
   属性:source(src) :
    1.网络地址
    2.本地地址:绝对路径(基本不用),相对路径
    注意：无论什么操作系统，路径中的斜杠都使用/（正斜杠） -->
  alt属性:当图片加载失败时显示的文本信息 -->
  <!-- 1.网络地址 -->
  <img src="https://picx.zhimg.com/v2-d6f44389971daab7e688e5b37046e4e4_720w.jpg?source=172ae18b" alt="图片">

  <!-- 2.本地地址:相对路径 -->
  <img src="./images/steve.jpg" alt="史蒂夫·乔布斯">
</body>

</html>
