<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    span,
    strong {
      float: left;
    }

    span {
      background-color: red;
    }

    strong {
      background-color: green;
      margin-left: -10px;
    }
  </style>
</head>

<body>
  <span>我是span元素</span>
  <strong>我是strong元素</strong>
  <!-- 注意如果是父子元素，子元素没有设置宽度，设置了margin-left:-10px
 块级元素宽度（固定，eg1200px)=auto+-10 -->
</body>

</html>
