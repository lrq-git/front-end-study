<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 注意flex-flow属性是flex-deriction和flex-wrap的简写 ，也可以都省略 */
    .container {
      width: 500px;
      height: 500px;
      /* 注意一般情况下不会设置死的高度，所以一般没有剩余空间 */
      background-color: orange;
      display: flex;
      flex-wrap: wrap;

    }

    .item {
      width: 120px;
      height: 120px;
      background-color: #f00;
    }

    .item1 {
      order: 5;
      height: 90px;
    }

    .item2 {
      order: 3;
      /* order，决定item的顺序，默认值是零，如果是零，则按照html里面的顺序排布，值越小越被优先排布 */
      height: 150px;

    }

    .item3 {
      order: 9;
      height: 120px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="item item1">1</div>
    <div class="item item2">2</div>
    <div class="item item3">3</div>


  </div>
</body>

</html>
