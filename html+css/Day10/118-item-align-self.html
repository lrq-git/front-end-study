<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 注意flex-flow属性是flex-deriction和flex-wrap的简写 ，也可以都省略 */
    .container {
      width: 500px;
      height: 500px;
      /* 注意一般情况下不会设置死的高度，所以一般没有剩余空间 */
      background-color: orange;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      /* 如果盒子没有高度，那么会拉伸 */
    }

    .item {
      width: 120px;
      height: 120px;
      background-color: #f00;
    }

    .item1 {

      height: 90px;
    }

    .item2 {

      height: 150px;
      align-self: flex-start;
    }

    .item3 {

      height: 120px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="item item1">1</div>
    <div class="item item2">2</div>
    <div class="item item3">3</div>


  </div>
</body>

</html>
