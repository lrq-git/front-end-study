<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 注意flex-flow属性是flex-deriction和flex-wrap的简写 ，也可以都省略 */
    .container {
      width: 500px;
      height: 500px;
      /* 注意一般情况下不会设置死的高度，所以一般没有剩余空间 */
      background-color: orange;
      display: flex;

    }

    .item {
      width: 120px;
      height: 120px;
      background-color: #f00;
      flex-shrink: 0;
      /* 会不压缩，如果超出的话，没有换行 */
    }

    .item1 {
      flex-shrink: 1;
    }
  </style>
</head>

<body>
  <!-- 注意flex-shrink的默认值是1，会压缩 -->
  <div class="container">
    <div class="item item1">1</div>
    <div class="item item2">2</div>
    <div class="item item3">3</div>
    <div class="item item4">1</div>
    <div class="item item5">1</div>



  </div>
</body>

</html>
