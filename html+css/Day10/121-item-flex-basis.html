<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 知识点：注意决定flex item 最终主轴上的base size优先级从高到低为：
    1.max-width|max-height|min-width
    2.flex-basis
    3.width\height
    4.内容本身的size */
    /* 注意flex-flow属性是flex-deriction和flex-wrap的简写 ，也可以都省略 */
    .container {
      width: 500px;
      height: 500px;
      /* 注意一般情况下不会设置死的高度，所以一般没有剩余空间 */
      background-color: orange;
      display: flex;

    }

    .item {
      /* width: 120px; */
      flex-basis: 120px;
      /* 基础尺寸 ，为了把某些东西可以完整的显示，会扩展尺寸*/
      /* 注意如果 1. flex-basis:auto,此时width生效2.如果width和flex-basis都设置了，实际上是flex-basis生效以后，但又要限制在width的宽度里面*/
      height: 120px;
      background-color: #f00;

    }
  </style>
</head>

<body>

  <div class="container">
    <div class="item item1">1</div>
    <div class="item item2">2我coderwhy_hhhhh_hhhhhhhhhhhhhh</div>
    <!-- 会把coderwhy_hhhhh_hhhhhhhhhhhhhh视为一个单词 -->
    <div class="item item3">3</div>




  </div>
</body>

</html>
