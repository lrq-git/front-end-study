<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .container {
      width: 500px;
      height: 500px;
      /* 注意一般情况下不会设置死的高度，所以一般没有剩余空间 */
      background-color: orange;
      display: flex;

    }

    .item {
      width: 120px;
      height: 120px;
      background-color: #f00;
      /* 注意flex是flex-grow\flex-shrink(可以省略）\flex-basis（这个一定是有单位的）的简写 ，可以指定1、2、3个值
      1.如果值是none,默认是0,0，auto
      2.如果值是auto,默认是1,1，auto
      3.1个值：如果没有单位是flex-grow，如果有单位是flex-basis
      4.两个值*/
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="item item1">1</div>
    <div class="item item2">2我coderwhy_hhhhh_hhhhhhhhhhhhhh</div>
    <!-- 会把coderwhy_hhhhh_hhhhhhhhhhhhhh视为一个单词 -->
    <div class="item item3">3</div>




  </div>
</body>

</html>
