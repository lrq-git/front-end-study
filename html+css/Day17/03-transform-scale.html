<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* scale(x,y) scaleX(), scaleY()
    sclae设置一个值 transform: scale(2); 等同于变换：scaleX(2) scaleY(2);
    二个值时，设置 x 轴和 y 轴上的缩放 
    他的值一共有两种类型：值和百分比*/
    body {
      text-align: center;
      padding-top: 200px;

    }

    .container {
      display: inline-block;
      border: 20px solid red;
    }

    .box {
      width: 200px;
      height: 200px;
      background-color: orange;
      /* 形变 */
      transform: scale(60%, 60%);
      /* 这里的60%相对于自身,一般不用百分比 */
    }

    .box1 {
      width: 200px;
      height: 200px;
      background-color: orange;
      /* 形变 */
      /* 0-1 对元素进行缩小  */
      /* 注意如果设置1.多，会放大，但是不会撑大父元素，不会影响标准流里的布局 */
      /* transform: scale(0.6, 0.6); */
      /* transform: scale(1.2, 1.2); */

      /* 这里0.6也是相对于自身 */
    }

    .box1:hover {
      transform: scale(1.1, 1.1);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="box">
    </div>
  </div>
  <div class="container">
    <div class="box1">

    </div>
  </div>
</body>

</html>
