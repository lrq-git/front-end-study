<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* rotate:还有别的单位 */
    body {
      text-align: center;
      margin-top: 200px;
    }

    .container {
      display: inline-block;
      border: 10px solid red;
    }

    .box {
      width: 200px;
      height: 100px;
      background-color: orange;
    }

    .box:hover {
      transform: rotate(90deg);
      /* 只有一个值，正是顺时针，负是逆时针 */
      /* 单位是deg，而且旋转围绕的点是元素的中心点，因为默认的形变原点是transform-origin:center center */
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="box"></div>
  </div>
</body>

</html>
