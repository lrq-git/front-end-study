<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 一个行盒里面的多个行内级元素（文本，行内块，行内元素）如何对齐！！！ */
    .box {
      background-color: orange;

    }

    .box img {
      width: 200px;
      /* 只设置宽度，高度就会按照原来图片的比例计算出来 */
    }

    span {
      display: inline-block;
      width: 100px;
      height: 100px;
      background-color: red;
      /* margin-bottom: 20px; */
    }
  </style>
</head>

<body>
  <div class="box">
    我是哈哈哈哈哈哈哈哈
    <img src="./images/01.png" alt="">
    <!-- 加了图片此时会发现，图片底部有几像素，这是因为行盒要把所有的内容包裹起来,并且vertical-align的默认值是基线对齐，有几像素是因为文本的基线并不是文本的最底部 -->
    <span class="small"></span>
    <!-- 会发现如果这里放一个盒子，下面也会有几像素 -->

    <!-- 注意：当inline box 有文本的时候，他的基线就不会是在最底部，而是在最后一行文本的基线
     当它设置了margin-bottom的时候，基线会移在margin-bottom那里  -->
  </div>
</body>

</html>
