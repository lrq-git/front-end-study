  <title>Document</title>
  <style>

    如何解决 */

      background-color: orange;
      /* 如何解决：把vertical-align的值设置为top ,注意这个要设置给行盒里面的行内元素，不是设置给父元素*/
      /* vertical-align: top; */
    }

    .box img {
      /* vertical-align: top; */
      /* vertical-align: middle; */
      vertical-align: bottom;
      /* 1.vertical-align的默认值是baseline */

      /* 第二种解决方案 */
      /* display: block; */
    }
  </style>
</head>

<body>
  <div class="box">
    <img src="./images/01.png" alt="">

  </div>
