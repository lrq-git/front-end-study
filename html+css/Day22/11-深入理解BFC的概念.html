<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* BFC解决折叠问题 */
    /*  BFC:
    1.在垂直方向上一个挨一个排布
    2。垂直方向上的间距由margin决定
    3.在同一个BFC中，相邻的元素的margin会折叠
    4.每个元素的左边缘紧挨着包含块的左边缘*/
    .container {
      overflow: auto;
    }

    .box1 {
      height: 200px;
      background-color: orange;
      margin-bottom: 40px;
      /* overflow: auto; */
      /* 此时虽然box1形成了一个BFC，但是他和box2还是在html同一个BFC里面 */
    }

    .box2 {
      height: 300px;
      background-color: purple;
      margin-top: 40px;
    }

    /* 解决折叠方法：让这两个元素不在同一个BFC中 */
  </style>
</head>

<body>
  <div class="container">
    <div class="box1"></div>
  </div>

  <div class="box2"></div>
</body>

</html>
