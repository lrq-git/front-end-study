<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <!-- 布局视口宽度等于设备的宽度 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- 设置布局视口的宽度 ,这个设置是针对移动端-->
  <meta name="viewport" content="width=980px" ,maximum-scale="1.0" ,minimum-scale="1.0" user-scalable="no">
  <!-- 布局视口影响最终显示效果 -->


  <!-- user scalable 如果设置no,则不让用户缩放，但有些浏览器会禁止这个属性-->
  <title>Document</title>

</head>

<body>
  <div class="box"></div>
</body>

</html>
