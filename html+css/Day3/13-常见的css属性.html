<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .title {
      /* 1.font-size属性 */
      /* 简写fz就可以打出来，是一种element语法 */
      font-size: 24px;
      /* 2.color属性 :前景色，不仅可以设置文字颜色*/
      color: chocolate;
      /* 3.background-color属性:背景色 */
      /* 简写bgc就可以打出来，是一种element语法 */
      background-color: black;
      /* 4.width属性:宽度 */
      width: 200px;
      /* 5.height属性:高度 */
      height: 100px;
    }
  </style>
</head>

<body>
  <div class="title">hello world</div>
  <!-- 默认大小是16px -->
  <!--注意：div块级元素，默认的宽度为一整行，高度由内容撑起来  
  即使设置了宽和高，也会独占一行-->
</body>

</html>
