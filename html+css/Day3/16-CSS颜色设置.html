<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      /* 1.用颜色关键字不区分大小写，一般不会用这个 */
      color: white;
      /* 2.RGB：红绿蓝：取值0-255
      黑色是最纯洁的颜色rgb(0, 0, 0),白色（255, 255, 255），所以值调的越小越接近黑色 */
      background-color: rgb(100, 100, 100);
      /* 3.十六进制颜色，把rgb的值都转换成十六进制 */
      /* background-color: #646464;黑色：#000或者#000000 */
      /* 4.RGBA：在RGB的基础上增加了透明度，后面再讲*/

    }
  </style>
</head>

<body>
  <div class="box">hhhh </div>
</body>

</html>
