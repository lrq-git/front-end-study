  <h2>旅游</h2>
  <p>
    根据国家移民管理局公开的移民管理机构累计查验出入境人次数据，初步预计2025年中国入境游客接待总量有望超过2019年水平。从市场结构来看，外国人入境旅游市场增长势头强劲，展现出积极向好的发展潜力；从洲际来看，亚洲市场对中国入境旅游市场的贡献显著提升，也间接印证了共建“一带一路”国家来华旅游市场更快的恢复和增长。
  </p>
