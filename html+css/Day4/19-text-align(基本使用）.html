<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      color:white;
      background-color: #f00;
      text-align: center;
      /* left：左对齐 */
      /* right：右对齐 */
      /* center：居中对齐 */
      /* justify：两端对齐 ，如果要设置为两端对齐，只设置justify是没有用的*/
    }
  </style>
</head>

<body>
  <!-- text-align 属性非常重要 -->
  <div class="box">
    我是div元素
  </div>
</body>

</html>
