<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      font-weight: bold;
      /* font-weight属性用于设置字体的粗细 */
      /* normal：正常字体粗细 */
      /* bold：加粗字体 */
      /* 100-900：数值越大，字体越粗，一般常用400（相当于normal）和700（相当于bold） */
      font-style: italic;
      /* font-style属性用于设置字体样式 */
      /* normal：正常字体样式 */
      /* italic：斜体 (字体本身支持斜体时）*/
      /* oblique：倾斜体（字体没有设置斜体时如何展示时） */
    }

    .box1 {
      font-variant: small-caps;
      /* font-variant属性用于设置字体变体(英文字母) */
      /* normal：正常字体变体 */
      /* small-caps：小型大写字母 */
    }
  </style>
  <link rel="stylesheet" href="./CSS/base.css">
</head>

<body>
  <div class="box">我是div元素</div>
  <div>我是div元素</div>
  <div class="box1">My name is lrq </div>
</body>

</html>
