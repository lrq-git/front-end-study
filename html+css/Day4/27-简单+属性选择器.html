<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 选择器 */
    /* 通配符选择器 */
    * {
      margin: 0;
      padding: 0;
    }

    /* 标签选择器 */
    div {
      color: red;
    }

    /* 类选择器 */
    .box {
      color: blue;
    }

    /* id选择器 在同一个HTML文档中，id必须唯一 不要重复*/
    #home {
      color: green;
    }

    /* 属性选择器 */
    [id] {
      font-size: 20px;
    }
  </style>
</head>

<body>
  <div>我是div1</div>
  <div class="box">我是div2</div>
  <div id="home">我是div3</div>

</body>

</html>
