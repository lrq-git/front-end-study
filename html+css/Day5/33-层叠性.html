<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 知识点：1.对于相同元素的同一个属性，可以通过不同选择器进行设置，那么属性会被一层一层覆盖，最终只有一个生效
    2.先看权重，权重大的生效；权重相同时，看顺序，后面的生效
    3.优先级：！important、内联样式表（style)、id、类与伪类与属性、元素与伪元素、通配符、继承 */
    div.box {
      color: black !important;
      /* 1.权重最高10000 */
    }

    /* 3.id选择器权值100 */
    #main {
      color: orange;
    }

    /* 4.类选择器权值10 */
    .one {
      color: purple;
    }

    /* 5.元素选择器权值1 */
    div {
      color: blue;
    }

    /* 6.通配符选择器权值0 */
    * {
      color: green;
    }
  </style>
</head>

<body>
  <!-- 2.内联样式权值1000 -->
  <div id="main" class="box one first content" style="color: red;">hhhhh</div>
</body>

</html>
