<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      display: inline-block;
      /* 敲dib就可以设置 */
      border: 1px solid red;
      /* line-height: 36px;行高也可以增加所谓的内边距 */
      /* padding: 上 右 下 左 */
      padding-top: 10px;
      padding-right: 20px;
      padding-bottom: 30px;
      padding-left: 40px;
      /* 也可以写成简写形式 */
    }
  </style>
</head>

<body>
  <div class="box">我是box</div>
</body>

</html>
