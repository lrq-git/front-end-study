<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 知识点：1.margin有两个问题：1）在父子元素中会有传递问题，左右没有传递问题，上下有（针对块级元素）
    margin-top:如果父子的顶部重叠，则块级的margin-top会传递给父元素 
    margin-bottom:如果父子的底部重叠，父元素的高度是auto,则块级的margin-bottom会传递给父元素 
    解决方案：1.给父元素设置padding来代替
    2.给父元素设置border
    3.触发BFC:给父元素设置overflow:auto
    2）折叠问题：左右不会折叠，上下会折叠，两个值进行比较，选择大的（父子与兄弟都会）
    2.marigin一般设置兄弟之间，padding一般设置父子元素*/
    body {
      /* 暂时解决方案*/
      font-size: 0;
      /*把父元素的字体大小设置为0，这样子元素之间的空格就没有了*/
      /* 但这种解决方案有问题，如果把字体大小设为零，子元素会继承，不利于开发 */
    }

    .box {
      display: inline-block;
      width: 100px;
      height: 100px;
      background-color: red;
      /*margin-bottom: 50px;
       margin上下会有折叠效果，意思是如果两个上下挨着的元素，上面设置margin-bottom，下面设置margin-top，那么它们之间的距离会取两者中较大的那个值,不会加起来（左右没有折叠效果） */
      /* margin-right: 30px; */
    }

    .content {
      display: inline-block;
      width: 100px;
      height: 100px;
      background-color: green;
      /* margin-left: 30px; */
      /* 左右不折叠 */
      /* margin: 10px 20px; */
      /*这样设置有问题，跟对齐方式有关*/
      margin: 0 20px;
    }

    div,
    span {
      font-size: 20px;
    }
  </style>
</head>

<body>
  <!--<div class="box"></div><div class="content"></div>  如果这样写两个盒子之前就不会有间距，
  下面写法有间距是因为有换行符造成了空格显示，但是要保证代码可读性，要用下面这种写法-->
  <div class="box"></div>
  <div class="content"></div>
  <span>hhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhhh</span>
  <div>哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈哈</div>
</body>

</html>
