<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      width: 300px;
      height: 300px;
      background-color: red;
      /* padding-left: 30px;
      box-sizing: border-box; */
      /* 会把盒子撑大 */
      /* 盒子大小为内容+padding+boder */
      padding-top: 100px;
      box-sizing: border-box;
    }

    .content {
      width: 100px;
      height: 100px;
      background-color: green;
      margin-left: 100px;
      /* 这样的好处是不用设置box-sizing */
      /* margin-top: 100px; */
      /*  会把box盒子给带下去*/
    }
  </style>
</head>

<body>
  <!-- 实现子元素距离父元素的左上有一定的间距 -->
  <div class="box">
    <div class="content"></div>
  </div>
  <!-- margin:设置兄弟元素之间的距离 -->
</body>

</html>
