<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      width: 300px;
      height: 300px;
      background-color: red;
    }

    .content {
      width: 100px;
      height: 100px;
      background-color: green;
      margin-left: 30px;
      /* 左右不会传递 */
      margin-top: 100px;
      /* 上下会传递 */
    }
  </style>
</head>

<body>
  <!-- 如何防止出现传递问题：
 1.给父元素设置padding
 2.给父元素设置边框
 3.触发BFC：设置overflow为auto -->
  <div class="box">
    <div class="content"></div>
  </div>
</body>

</html>
