<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* margin-bottom传递 */
    .box {
      width: 300px;
      height: auto;
      /* 如果不设置，默认也是auto */
      background-color: red;
    }

    .container {
      width: 100px;
      height: 100px;
      background-color: green;
      margin-bottom: 100px;
    }
  </style>
</head>

<body>
  <div class="box">
    <div class="container"></div>
  </div>
  <div>哈哈哈哈哈哈哈哈哈啊</div>
</body>

</html>
