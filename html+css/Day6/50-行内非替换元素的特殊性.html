<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .content {
      background-color: red;
      color: white;
      /* 内容：width/height(压根不生效) */
      width: 300px;
      height: 300px;
      /*内边距：padding  */
      /* 特殊：上下会被撑起来，但是不占据空间，左右正常会占据空间
      不占据空间会导致下面的元素上移 */
      /* padding: 50px; */

      /* border */
      /* 特殊：上下会被撑起来，但是不占据空间，左右正常会占据空间 */
      /* border: 50px solid orange */
      /* margin */
      /* 上下不生效 */
      margin: 50px;
    }
  </style>

</head>

<body>
  <span class="content">
    我是span内容，哈哈哈哈哈
  </span>
  aaaaaa
  <div>hahahahah</div>
</body>
<!-- 注意:背景色有设置到border下面
 前景色会在border没有设置颜色时，显示出color颜色-->
<!-- box-sizing:cotent-box(默认)：padding，border在外边
 border-box:padding,border在width和height里面 -->

</html>
