<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./CSS/reset.css">
  <style>
    a {
      /* 因为包裹了块级元素 */
      display: inline-block;
      /* width:auto ,行内级元素会包裹整个内容*
      块级元素的也是width:auto,它的宽度会继承父元素/
      /* color: #888; */
      /* 如果不设置的话，颜色会是reset里面的a设置的颜色 */
      /* 注意外部样式表和内部样式表，没有谁有限起作用，其优先级还是看选择器权重决定，如果选择器权重一致，谁后谁起作用 */
    }

    /* inline：默认宽度为内容决定，受父元素宽度的限制
    inline-block默认宽度也为内容决定，但不受父元素宽度限制 */
    .item {
      width: 308px;
      margin: 0 auto;
    }

    .item .album img {
      width: 100%;
      /* 看网站发现图片和外面的盒子宽度一样，所以设置为100%，只需设置宽度，高度会自动调整 */
      border-radius: 8px;
    }

    .item .info a {
      width: 100%;
      /* 行内块元素，宽度width:auto，仅包裹内容（不受父元素限制）
       inline：width:auto 的宽度为包裹内容  受父元素宽度限制
      块级元素的也是width:auto,它的宽度也会父元素宽度限制*/
    }


    .item .info p {
      font-size: 15px;
      margin-top: 8px;
      /* 下面代码的实现前提得宽度要定下来  */
      /* 显示一行*/
      /*  white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis; */
      /* 没有隐藏 */
      /* 两行显示 */
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      line-clamp: 2;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .item .info .anchor {
      font-size: 13px;
      color: #888;
      margin-top: 5px;
    }

    .item .info .anchor::before {
      /*  伪元素是行内非替换元素 
      content: url(./images/bilibili.svg);
      display: inline-block;
      无法改正大小:因为content:url()引入的图片是行内替换元素，默认尺寸由其本身的固定宽高决定的，设置的宽高会被忽略掉
      也就是固有尺寸的优先级高，直接设置的width height无效
       width: 16px;
      height: 16px;
      如果要微调，用相对定位 position: relative;
      top: 2px */
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      background: url(./images/bilibili.svg) no-repeat center;
      /* 这个是推荐图标的放置方法 */
      background-size: contain;
      position: relative;
      top: 5px;
    }
  </style>
</head>

<body>
  <div class="item">

    <div class="album">

        </p>
      </a>

   先写内容，在写布局 -->

  <!-- 注意：刚开始写的时候可以不用管是否有超链接，后续如果有超链接，只需要在外面包裹一个a元素 -->
  <!-- 加图标的问题
