<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    body {
      margin: 0;
    }

    .box {
      height: 574px;
      background-color: #f00;
      background-image: url(./images/03.png);
      /* 如果要设置缩小浏览器时，图片跟着移动，永远能显示中间内容*/
      /* 1.用背景做，后面也可以用定位实现 */
      background-position: center;
    }
  </style>

</head>

<body>
  <!-- 在网站中显示图片 -->
  <div class="box"></div>
</body>

</html>
