<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./CSS/reset.css">
  <!-- 2.重置样式 -->
  <style>
    ul>li {
      margin: 14px 0;
      /* margin会上下折叠 */
    }

    ul>li>a {
      display: inline-block;
    }

    ul>li>a:hover {
      color: #f00;
    }

    /* 局部 */
    ul>li .ranking {
      display: inline-block;
      width: 24px;
      height: 24px;
      margin-right: 3px;
      text-align: center;
      line-height: 24px;
      font-weight: 700;
      color: #999;
    }

    /* 伪类：结构伪类 */
    ul>li:nth-child(1) .ranking {
      color: #f00;
      /* 注意这样不生效，虽然与上面的优先级一样，应该是后面的生效，但是这个颜色给ranking是继承的属性，继承与权重无关，优先级非常低 */
    }

    ul>li:nth-child(2) .ranking {
      color: #0f0;
    }

    ul>li:nth-child(3) .ranking {
      color: #00f;
    }

    ul>li .content {
      display: inline-block;
    }

    ul>li .icon {
      display: inline-block;
      width: 16px;
      height: 16px;
      /* 只要设置宽高的时候就要考虑这个盒子的类型 */
      /* background-image: url(./images/new_icon.svg); */
      /* 这里有个问题 ,如果用png图片：32*32，这个显示的时候有问题*/
      /* 做微调 */
      position: relative;
      top: 2px;
      left: 4px;
    }

    /* 把重复的放在一起，特别的单独抽出来 */
    ul>li .new {
      background-image: url(./images/new_icon.svg);
    }

    ul>li .hot {
      background-image: url(./images/hot_icon.svg);
    }
  </style>
</head>

<body>
  <!-- 1.先搭结构 -->
  <ul>
    <li class="item">
      <a href="#">
        <span class="ranking">1</span>
        <div class="content">
          一花一世界，明媚春天，杜鹃花开满枝头
          <!-- 每个内容都不要单独的放在这里，最好把它包裹起来 -->
        </div>
        <!-- 这里的div也可以换成p元素，但是换成p元素，需要对其进行重置，因为上下会默认有margin -->
        <i class="icon new"></i>
      </a>
    </li>
    <li class="item">
      <a href="#">
        <span class="ranking">2</span>
        <div class="content">
          一花一世界，明媚春天，杜鹃花开满枝头
          <!-- 每个内容都不要单独的放在这里，最好把它包裹起来 -->
        </div>
        <!-- 这里的div也可以换成p元素，但是换成p元素，需要对其进行重置，因为上下会默认有margin -->

      </a>
    </li>
    <li class="item">
      <a href="#">
        <span class="ranking">3</span>
        <div class="content">
          一花一世界，明媚春天，杜鹃花开满枝头
          <!-- 每个内容都不要单独的放在这里，最好把它包裹起来 -->
        </div>
        <!-- 这里的div也可以换成p元素，但是换成p元素，需要对其进行重置，因为上下会默认有margin -->
        <i class="icon new"></i>
      </a>
    </li>
    <li class="item">
      <a href="#">
        <span class="ranking">4</span>
        <div class="content">
          一花一世界，明媚春天，杜鹃花开满枝头
          <!-- 每个内容都不要单独的放在这里，最好把它包裹起来 -->
        </div>
        <!-- 这里的div也可以换成p元素，但是换成p元素，需要对其进行重置，因为上下会默认有margin -->

      </a>
    </li>
    <li class="item">
      <a href="#">
        <span class="ranking">5</span>
        <div class="content">
          一花一世界，明媚春天，杜鹃花开满枝头
          <!-- 每个内容都不要单独的放在这里，最好把它包裹起来 -->
        </div>
        <!-- 这里的div也可以换成p元素，但是换成p元素，需要对其进行重置，因为上下会默认有margin -->
        <i class="icon hot"></i>
      </a>
    </li>
  </ul>
  <!-- 1.先完成结构
   2.重置样式（body,a,ul)
   3.先整体、后局部：顺序：按照从外到里，从上到下
   4.去除重复的代码
   将重复的逻辑放在一个类里面
    不同的代码抽取到不同的class-->

  <!-- 注意：继承不管权重，只要是自己设置的，一定自己的优先 -->
</body>

</html>
