      /* 这个是一个继承属性 */

    td,
    th {
      border: 1px solid #333;
      /* 注意这个边框是给td设置的 */
      padding: 8px 16px;
    }

    table tr:nth-child(1) {
      font-weight: bold;
      color: red;
      /* thead,tbody,tfoot里面都有tr,所以如果只要第一行要精准设置属性 */
    }

</head>
