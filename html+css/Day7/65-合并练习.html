<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    table {
      border-collapse: collapse;
      text-align: center;
    }

    td {
      border: 1px solid #f00;
      /* padding: 10px 20px;不设置内边距,可以直接设置宽高 */
      width: 100px;
      height: 30px;

    }

    tr.head {
      font-weight: 700;
      font-size: 20px;
    }

    /* n从0开始取值 */
    table tr:nth-child(-n+2) {
      font-weight: 700;
      font-size: 20px;
    }

    table tr td[rowspan] {
      /* 用属性选择器 */
      font-weight: 700;
      font-size: 20px;
    }

    /* 不知道用哪个选择器，就可以加class */
  </style>

</head>

<body>
  <table>
    <!-- 使用element语法tr*12>td*6{数学} -->
    <tr class="head">
      <td colspan="6">课程表</td>
    </tr>
