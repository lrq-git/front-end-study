<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body>
  <form action="">
    <div>
      用户：<input type="text">
    </div>
    <div>
      密码：<input type="password">
    </div>
  </form>
  <!-- 为了实现点击前面的文字就可以聚焦到后面的文本框 -->
  <form action="">
    <div>
      <label for="username">
        用户：
        <input id="username" type="text">
      </label>

    </div>
    <div>
      <label for="password">
        密码：
        <input id="password" type="password">
      </label>
      label设置完以后，input要设置id
    </div>
  </form>
</body>

</html>
