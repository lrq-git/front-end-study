<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    div {
      cursor: pointer;
      text-decoration: underline;
      color: blue;
      /* auto:浏览器决定；default:箭头（很少设置），text：竖线，none:鼠标消失 */
      /* 后面可以用JS进行跳转 */
    }
  </style>
</head>

<body>
  <!-- 所有的元素会默认一个cursor的值是auto ,由浏览器决定-->
  <div class="box">我是box</div>
  <a href="">百度一下</a>
</body>

</html>
