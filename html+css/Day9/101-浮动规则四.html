<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 知识点：规则四：浮动元素不能与行内级内容层叠，行内级内容会被浮动元素推出，例如行内级元素、行内块级元素、块级元素的文字内容
    可以做出来文字环绕图片的效果 */
    .box {
      width: 1000px;
      height: 400px;
      background-color: orange;
    }

    .box strong {
      float: left;
      /* position: fixed; */
      /* 这个会盖住 */
    }
  </style>

</head>

<body>
  <div class="box">
    <span>我是span元素</span>
    <strong>我是strong元素</strong>
    <i>我是i元素</i>
    <div>我是普通的内容</div>
  </div>
</body>

</html>
