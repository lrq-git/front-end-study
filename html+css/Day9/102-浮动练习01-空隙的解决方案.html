<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    span {
      background-color: orange;
      float: left;
      margin-right: 5px;
      /* 如果不设置浮动，间隙是不精准的 */
    }
  </style>
</head>

<body>
  <!-- 将多个行内级元素中间的空格（间隙）去除的方法：
   1.删除换行符（不推荐）
   2.设置父元素的字体大小为0，但需要子元素设置回来
   3.设置浮动,子元素统一向一个方向浮动
   4.flex布局-->
  <div class="box">
    <span>aaa</span>
    <span>bbb</span>
    <span>ccc</span>
  </div>
</body>

</html>
