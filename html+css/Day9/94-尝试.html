<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box1 {
      width: 300px;
      height: 300px;
      background-color: red;
      /* position: relative; */
    }

    .box2 {
      width: 200px;
      height: 200px;
      background-color: green;
      position: absolute;
      /* 他虽然脱离了标准流，但是会在span这个标准流的下面 */
    }
  </style>
</head>

<body>
  <div class="box1">
    <span>哈哈哈哈</span>
    <div class="box2"></div>
  </div>
</body>

</html>
