<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 不设置 默认值是auto,浏览器处理auto是0
    1.z-index越大，层叠在最上面
    2.z-index相等，写在后面的元素层叠在上面 */
    /* 只对定位元素有效 */
    .item {
      position: fixed;
      width: 100px;
      height: 100px;
      left: 0;
      top: 0;
      background-color: red;
    }

    .box2 {
      left: 20px;
      top: 20px;
      background-color: green;
    }

    .box3 {
      left: 40px;
      top: 40px;
      background-color: blue;
    }
  </style>
</head>

<body>
  <div class="item box1">1</div>
  <div class="item box2">2</div>
  <div class="item box3">3</div>

</body>

</html>
