<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 知识点：浮动：解决原来很多dib盒子的水平排布（左右）浮动：float:none;left;right
    浮动可以指定一个元素在容器中放置在左侧或者右侧 ，允许文本和内联元素环绕
    脱离标准流
    浮动规则一和二：脱离标准流，向左或向右移动，自己的边界紧贴着包含块（父元素）(不能超出父元素），或者其他浮动元素的边界位置；普通元素—(非定位元素）—浮动元素——定位元素（定位元素会层叠在浮动元素上面）
    注意： 父元素紧贴着父级元素的内边距*/
    body {
      margin: 0;
      padding: 0;
    }

    .box {
      width: 200px;
      height: 200px;
      background-color: orange;
      margin: 0 auto;
      padding: 10px;
    }

    .item1,
    .item2 {
      background-color: red;
    }

    .item1 {
      /* 浮动脱标：脱离标准流，能和行内级元素在同一行显示 */
      float: left;
      /* 定位脱离标准流，会把2给盖住，完全脱标 */
      /* position: fixed;
      left: 0;
      top: 10px; */
      background-color: greenyellow;
    }

    .item2 {
      float: right;

    }
  </style>
</head>

<body>
  <div class="box">
    <div class="item1">1</div>
    <div class="item2">2</div>
  </div>

</body>

</html>
