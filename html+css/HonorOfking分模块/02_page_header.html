<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王者荣耀-header</title>
  <link rel="stylesheet" href="./CSS/reset.css">
  <link rel="stylesheet" href="./CSS/common.css">
  <style>
    .header {
      background-color: rgba(0, 0, 0, .8);
    }

    .header .area {
      display: flex;
      justify-content: space-between;
      height: 84px;
      /* line-height: 84px; */
      /* background-color: orange; */
    }

    .header .area .left-area {
      display: flex;
      /* background-color: red; */
    }

    .header .area .left-area .logo a {
      position: relative;
      top: 50%;
      transform: translate(0, -50%);
      /* 父元素必须要有高度，由内容撑起来的不算，但是flex布局的延伸算 */
      display: block;
      width: 200px;
      height: 54px;
      text-indent: -9999px;
      background-color: red;
    }

    .header .area .left-area .nav-list {
      margin-left: 30px;
      display: flex;
    }

    .header .area .left-area .nav-list .item {
      /* 一般这个item都是固定的宽度，或者包裹内容由margin撑起来 */
      width: 110px;
      padding-right: 5px;
      /* background-color: blueviolet; */
    }

    .header .area .left-area .nav-list .item:hover,
    .header .area .left-area .nav-list .item.active {

      background-color: blue;
    }

    .header .area .left-area .nav-list .item:hover a,
    .header .area .left-area .nav-list .item.active a {
      color: #e4b653;
      /* background-color: blue; */
    }

    .header .area .left-area .nav-list .item:hover .desc,
    .header .area .left-area .nav-list .item.active .desc {
      color: #91763f;

    }

    .header .area .left-area .nav-list a {
      display: block;
      /* 这里设置block,则盒子就会由行高撑起来,高度不继承，行高继承,会继承子子孙孙*/
      height: 100%;
      box-sizing: border-box;
      padding-top: 20px;
      /* background-color: blue; */
      font-size: 18px;
      color: #c9c9dd;
      text-align: center;
    }

    .header .area .left-area .nav-list a .desc {
      display: block;
      margin-top: 8px;
      font-size: 12px;
      color: #898792;
    }

    .header .area .left-area .search {
      margin-left: 10px;
    }

    .header .area .left-area .search a {
      position: relative;
      top: 50%;
      transform: translate(0, -50%);
      /* 向上移动是- */
      /* line-height: 26px; */
      display: block;
      width: 27px;
      height: 26px;
      background-color: orchid;
    }

    .header .right-area {
      display: flex;
      align-items: center;
      /* background-color: green; */
    }

    .header .right-area img {
      border-top: 6px solid #d9ad50;
      border-bottom: 6px solid #d9ad50;
      border-left: 3.5px solid #d9ad50;
      border-right: 3.5px solid #d9ad50;
      border-radius: 50%;
      /* 让边框的形状变为圆的 */
    }

    .header .right-area .info {
      margin-left: 10px;
    }

    .header .right-area .info a {
      color: #fff;
    }

    .header .right-area .info p {
      font-size: 12px;
      color: #858792;
      margin-top: 5px;
    }
  </style>
</head>

<body>
  <div class="header">
    <!-- 前面这里需要包裹是因为外面这里需要设置背景色 -->
    <div class="header_wrapper area">
      <div class="left-area">
        <h1 class="logo">
          <a href="">王者荣耀</a>
        </h1>
        <ul class="nav-list">
          <li class="item active">
            <a href="">
              游戏资料
              <span class="desc">DATA </span>
            </a>
          </li>
          <li class="item">

            </a>
          </li>
          <li class="item">
            <a href="">
              游戏资料
              <span class="desc">DATA </span>
            </a>
          </li>
          <li class="item">
            <a href="">
              游戏资料
              <span class="desc">DATA </span>
            </a>
          </li>
          <li class="item">
            <a href="">
              游戏资料
              <span class="desc">DATA </span>
            </a>
          </li>
          <li class="item">
            <a href="">
              游戏资料
              <span class="desc">DATA </span>
            </a>
          </li>
          <li class="item">
            <a href="">
              游戏资料
              <span class="desc">DATA </span>
            </a>
          </li>
        </ul>
        <div class="search">
          <a href=""></a>
        </div>
      </div>
      <div class="right-area">

    </div>

  </div>
</body>

</html>
