<!DOCTYPE html>
<html lang=zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="./CSS/reset.css">
  <link rel="stylesheet" href="./CSS/common.css">
  <style>
    .main {
      /* height: 100px; */
      background-color: red;
    }

    .news-section {
      display: flex;
      height: 342px;
      /* background-color: orange; */
    }

    .news-section .banner {
      width: 605px;
      background-color: #000;
    }

    .news-section .banner .image_list {
      display: flex;
      width: 604px;
      overflow: hidden;
    }

    .news-section .banner .image_list .item {
      flex-shrink: 0;
      width: 100%;
      /* 防止图片放在flex布局里面被缩小 */

    }

    .news-section .banner .image_list .item a {
      display: block;
    }

    .news-section .banner .image_list .item a img {
      width: 100%;
    }

    .news-section .banner .title_list {
      display: flex;
      height: 44px;
      line-height: 44px;
    }

    .news-section .banner .title_list .item {
      /* 文字之间的间距是这样撑起来的 */
      flex: 1;
      text-align: center;
    }

    .news-section .banner .title_list .item a {
      display: block;
      font-size: 14px;
      color: #b1b2be;
    }

    .news-section .banner .title_list .item a:hover,
    .news-section .banner .title_list .item.active a {
      color: #f3c258;
      background-color: rgba(255, 255, 255, .15);
    }

    .news-section .news {
      flex: 1;
      /* 因为新闻部分的宽度最好不要写死 */
      padding: 0 17px;
      background-color: purple;
    }

    .news-section .download {
      width: 236px;
      background-color: skyblue
    }

    .news-section .download a {
      display: block;
      /* 真实开发这里的背景用的是精灵图 */

    }

    .news-section .download a.download-btn {
      background-color: blue;
      height: 106px;
    }

    .news-section .download a.guard-btn {
      height: 128px;
      background-color: blueviolet;
    }

    .news-section .download a.experience-btn {
      height: 108px;
      background-color: brown;
    }
  </style>
</head>

<body>
  <div class="main main_wrapper">
    <!-- 这里不需要包裹因为，除了中间其他的不需要设置样式 -->
    <div class="news-section">
      <div class="banner">
        <!-- 轮播图就是要放一个列表，然后后面改变transform来进行位移 -->
        <ul class="image_list">
          <li class="item ">
            <a href="">
              <img src="./img/banner_01.png" alt="" style="width: 604px; height: 298px;">
            </a>
          </li>
          <li class="item">
            <a href="">
              <img src="./img/banner_01.png" alt="" style="width: 604px; height: 298px;">
            </a>
          </li>
        </ul>
        <ul class="title_list">
          <li class="item active">
            <a href="">桑启的旅途故事</a>
          </li>
          <li class="item">
            <a href="">桑启的旅途故事</a>
          </li>
          <li class="item">
            <a href="">桑启的旅途故事</a>
          </li>
          <li class="item">
            <a href="">桑启的旅途故事</a>
          </li>
          <li class="item">
            <a href="">桑启的旅途故事</a>
          </li>
        </ul>
      </div>
      <div class="news">

        <ul class="title-list"></ul>
        <p class="notice"></p>
        <ul class="news-list"></ul>

      </div>
      <div class="download">
        <a href="" class="download-btn">
        </a>
        <a href="" class="guard-btn"></a>
        <a href="" class="experience-btn"></a>
      </div>
    </div>
    <div class="content-section"></div>
    <div class="match-section"></div>
  </div>
</body>

</html>
