<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王者荣耀-top</title>
  <link rel="stylesheet" href="./CSS/reset.css">
  <link rel="stylesheet" href="./CSS/common.css">
  <link rel="stylesheet" href="./CSS/animation.css">
  <style>
    .top {
      /* background-color: red; */
      border-bottom: 1px solid #f5f5f5;
    }

    .top .area {
      display: flex;
      justify-content: space-between;
      /* 为什么会左右区域自动撑满高度，因为align-items默认值是normal */
      height: 41px;
      line-height: 41px;
      /* background-color: orange; */
    }

    .top .left-area {
      display: flex;
      /* background-color: red; */
    }

    .top .left-area .logo a {
      position: relative;
      z-index: 11;
      /* 注意这里没有单位 */
      /* 因为这个logo没有被盖上，所以index要设置一下，但是index只能设置给定位元素，所以设置一下相对定位 */
      display: block;
      /* 直接设置块级元素，如果行内块级会下面有几像素 ，而且也可以直接把高度撑满*/
      width: 150px;
      /* 可以不设置高度因为，line-height会继承 */
      text-indent: -9999px;
      /* 隐藏文字，为了搜索引擎看到 */
      background: url(./img/top-logo.png) no-repeat center center/contain;
      background: 颜色 图片 位置 / 大小 重复 attachment
    }

    .top .left-area .recommend {
      position: relative;
    }

    .top .left-area .recommend:hover .recommend-ad {
      display: block;
      /* 这里是绝对定位元素，设置block只是为了展示 */
    }

    .top .left-area .recommend .recommend-ad {
      display: none;
      position: absolute;
      /* 不设置 默认值是auto,浏览器处理auto是0
    1.z-index越大，层叠在最上面
    2.z-index相等，写在后面的元素层叠在上面 */
      /* 只对定位元素有效 */
      z-index: 10;
      /* 如果不设置这个，后面的会浮在这个图片上面 */
      left: -150px;
      top: 0;
      /* 设置一固定宽高 */
      width: 970px;
      height: 185px;
      /* 因为右边区域也设置定位，所以定位元素在没有设置z-index的情况下，后面的层叠在后面 */
    }

    .top .right-area {
      display: flex;
      /* background-color: blue; */
    }

    .top .right-area .item a {

      position: relative;
      display: block;
      /* 让a元素的高度撑满 */
      font-size: 14px;
      color: #464646;
    }

    .top .right-area .item a.growth {

      padding-left: 30px;
      /* 因为图标脱标了，不占空间，设置这个可以给图标的空间空出来 */
    }

    .top .right-area .item .icon-grow {
      /* 一般情况下，让元素在中间，进行定位的设置 */
      position: absolute;
      width: 30px;
      height: 30px;
      left: 0;
      /* 注意这里要设置，图标才会紧靠父元素 */
      top: 0;
      bottom: 0;
      margin: auto 0;
      background: red;
    }

    .top .right-area .item a.ranking {
      position: relative;
      margin-left: 20px;
      padding-right: 30px;
    }

    .top .right-area .item a.ranking:after {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      top: 0;
      bottom: 0;
      margin: auto 0;
      background: red;
      opacity: 0.2;
      transform: rotate(90deg);
    }

    .top .right-area .item a.ranking .dropdown {
      position: absolute;
      top: 41px;
      right: 0;
      display: none;
    }

    .top .right-area .item a.ranking:hover .dropdown {
      display: block;
      animation: opacityAnim 400ms ease forwards;
      /*  none ：回到没有执行动画的位置
forwards ：动画最后一帧的位置
backwards ：动画第一帧的位置 */
    }

    .top .right-area .item a.ranking .dropdown iframe {
      width: 708px;
      height: 582px;
    }
  </style>
</head>

<body>
  <div class="top">
    <div class="top_wrapper area">
      <div class="left-area">
        <h2 class="logo">
          <a href="#">腾讯游戏</a>
          <!-- 这里的图片一边是设置背景 -->
        </h2>
        <div class="recommend">
          <img src="./img/top-logo.png" alt="" style="width: 230px; height: 40px;">
          <!-- 只要块级元素里面放了行内级元素，就想着用vertical-align -->
          <a class="recommend-ad">
            <img src="./img/banner_01.png" alt="" style="width: 970px;
      height: 185px;">
          </a>
          <!-- 一般这种元素先做出来，然后放置，后面只需要改变display就可以 -->
        </div>
      </div>
      <ul class="right-area">
        <li class="item">
          <a class="growth" href="">
            <i class="icon-grow"></i>
            成长守护平台
          </a>
          <!-- 一边伪元素用来添加一些图标 ，也可以加i-->
        </li>
        <li class="item">
          <a class="ranking" href="">
            腾讯游戏排行榜
            <!-- 因为放在这个里面，整体就是a，所以只需要div -->
            <div class="dropdown">
              <!-- 下拉菜单，固定宽高 -->
              <iframe src="" frameborder="0"></iframe>
            </div>
          </a>

        </li>
      </ul>
    </div>
  </div>
</body>

</html>
