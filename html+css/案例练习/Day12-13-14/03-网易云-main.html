<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网易云主要区域</title>
  <link rel="stylesheet" href="./CSS/reset.css">
  <link rel="stylesheet" href="./CSS/common.css">
  <style>
    .main .area {
      display: flex;
      justify-content: space-between;
      height: 500px;

      border: 1px solid #d3d3d3;
      border-width: 0 1px;
      background-image: url(./images/main_bg.png);
    }

    .main .area-left {
      width: 729px;
      /* background-color: red; */
      /* 写一部分就放一个背景色，看问题检查前面是否有问题 */
    }

    .main .area-right {
      width: 250px;
    }

    .main .area-right .user-login {
      /* text-align: center; */
      /* 让按钮居中，但这个属性会继承 */
      width: 250px;
      height: 126px;
      background-image: url(./images/main_sprite.png);
    }

    .main .area-right .user-login .desc {
      width: 205px;
      margin: 0 auto;
      padding-top: 16px;
      color: #666;
      font-size: 12px;
      line-height: 22px;
      /* 文字之间有间距 */
    }

    .main .area-right .user-login .btn {
      /* display: inline-block; */
      display: block;
      height: 31px;
      width: 100px;
      margin: 15px auto 0;
      /* 注意一定要加单位 */
      line-height: 31px;
      text-align: center;
      color: #fff;
      font-size: 12px;
      background: url(./images/main_sprite.png) 0 -195px;
    }
  </style>

</head>

<body>
  <div class="main">
    <div class="wrapper_02 area">
      <div class="area-left"></div>
      <div class="area-right">
        <div class="user-login">
          <p class="desc">
            登录网易云音乐，可以享受无限收藏的乐趣，并且无限同步到手机
          </p>
          <!-- 用a元素实现按钮 -->
          <a class="btn" href="">用户登录</a>
        </div>
      </div>
    </div>

  </div>
</body>

</html>
