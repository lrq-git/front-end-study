<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网易云主要区域</title>
  <link rel="stylesheet" href="./CSS/reset.css">
  <link rel="stylesheet" href="./CSS/common.css">
  <link rel="stylesheet" href="./CSS/header.css">
  <style>
    .main .area {
      display: flex;
      justify-content: space-between;
      /* height: 500px; */

      border: 1px solid #d3d3d3;
      border-width: 0 1px;
      background-image: url(./images/main_bg.png);
    }

    .main .area-left {
      width: 729px;
      /* background-color: red; */
      /* 写一部分就放一个背景色，看问题检查前面是否有问题 */
    }

    .main .area-right {
      width: 250px;
    }

    .main .area-right .user-login {
      /* text-align: center; */
      /* 让按钮居中，但这个属性会继承 */
      width: 250px;
      height: 126px;
      background-image: url(./images/main_sprite.png);
    }

    .main .area-right .user-login .desc {
      width: 205px;
      margin: 0 auto;
      padding-top: 16px;
      color: #666;
      font-size: 12px;
      line-height: 22px;
      /* 文字之间有间距 */
    }

    .main .area-right .user-login .btn {
      /* display: inline-block; */
      display: block;
      height: 31px;
      width: 100px;
      margin: 15px auto 0;
      /* 注意一定要加单位 */
      line-height: 31px;
      text-align: center;
      color: #fff;
      font-size: 12px;
      background: url(./images/main_sprite.png) 0 -195px;
    }

    .main .settle-singer,
    .main .hot-anchor {
      padding: 20px;
    }

    .main .settle-singer .list {
      padding: 5px 0;
    }

    .main .settle-singer .list .item {
      display: flex;
      /* 为什么a元素这里可以设置宽高，因为flex布局这里，如果设置为flex表明flex container 以 block level，特就是说也把a元素设置为了块级元素 */
      /* 是让每个小li里面的元素flex布局 */
      /* align-items: center; */
      /* normal(在flex布局里面nromal的效果与stretch的效果一致），stretch:：当 flex items 在 cross axis 方向的 size 为 auto 时，会自动拉伸至填充 flex container ,因为我们是希望拉伸的，因此不能设置center，不过center确实可以让元素在父元素里面垂直居中*/
      width: 210px;
      height: 62px;
      /* background-color: red; */
      /* 这里如果把flex去掉，设置宽高和背景，后者不显示，可能是因此此时用行内非替换元素里面放了div */
      margin-top: 15px;
      background-color: #fafafa;
    }

    .main .settle-singer .item .info {
      flex: 1;
      /* 剩余的宽度全部给你，如果里面内容非常多的话，也会撑出去 */
      /* 如果不设置的话，文本这里的盒子只会包裹内容，因此item还有剩余宽度，因此设置flex-grow:1 */
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      /* 能够让信息里面的两行文字在父盒子里面居中 */
      padding: 3px 12px;
      border: 1px solid #e9e9e9;
      border-left: none;
      /* 解决方案1： */
      overflow: hidden;
      /* 不会让他无限的增长 */
      /* width: 200px; */
      /* width: 100%;百分号是 使用外层元素的容纳区块宽度（the containing block's width）的百分比定义宽度。*/
      /* 如果设置了100%，则表明宽度有限制，则他的子元素就会受他的父元素宽度限制
      如果不设置宽度，他会无限的增长 */
    }

    .main .settle-singer .item .info .singer {
      font-size: 14px;
      font-weight: 700;
      color: #000;
    }

    .main .settle-singer .item .info .desc {
      font-size: 12px;
      color: #666;
      /* margin-top: 8px; */
      /* 文本超出显示...
      因为是flex布局，没有设置明确宽度会超出如何解决： */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      /* width: 100px; */
      /* 该元素必须有明确的宽度（width），否则不会触发溢出。
该元素必须是块级或行内块级元素（如 display: block 或 display: inline-block 
flexitem默认情况下宽高是包裹内容的，由内容决定宽高，但是可以设置宽度和高度，设了就有，没设就取默认值，内容多宽就多宽*/
    }
  </style>

</head>
