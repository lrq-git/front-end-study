<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      width: 200px;
      height: 200px;
      background-color: orange;
      /* 没有添加border-box */
      border: 20px solid red;
      /* 添加border-box，border就会在width，heigh之内 */
      /* box-sizing生效的前提，明确设置了宽度高度 */
      box-sizing: border-box;
    }
  </style>
</head>

<body>
  <div class="box"></div>
</body>

</html>
