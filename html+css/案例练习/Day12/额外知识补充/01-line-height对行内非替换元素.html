<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .box {
      background-color: #f00;
      color: #fff;
      line-height: 50px;
    }
  </style>

</head>

<body>
  <div class="box">哈哈哈哈</div>
  <!-- 盒子如果没有设置高度，则是由行高（内容）撑起来的，如果设置了行高，没有设置高度的情况下，文本也是垂直居中 -->
  <span class="box">哈哈哈哈</span>
  <!-- 对行内非替换元素也不能撑起来 -->
</body>

</html>
